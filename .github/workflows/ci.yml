name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Docs drift check
        run: tests/docs.sh
      - name: Changelog entry for code changes
        if: github.event_name == 'pull_request'
        run: tests/docs.sh --since "origin/${{ github.base_ref }}"
      - name: Drift check catches drift, bump script keeps docs aligned (on a copy)
        run: |
          src=$PWD
          copy() { rm -rf "$RUNNER_TEMP/r" && cp -r "$src" "$RUNNER_TEMP/r" && cd "$RUNNER_TEMP/r"; }
          caught() { if "$@" >/dev/null; then echo "drift not caught: $*"; exit 1; fi; }
          copy; sed -i 's/^G3_VERSION=.*/G3_VERSION="9.9.9"/' lib/core.sh; caught tests/docs.sh
          copy; sed -i 's/--no-color/--plain/g' README.md;               caught tests/docs.sh
          copy; sed -i 's/ ai-credits//' completions/g3rm0n.fish;        caught tests/docs.sh
          copy; echo '# tweak' >>lib/ui.sh; git add -A;                  caught tests/docs.sh --staged
          copy; sed -i 's/^## \[Unreleased\]$/## [Unreleased]\n\n### Fixed\n\n- CI dry run./' CHANGELOG.md
          scripts/bump-version.sh patch --date 2000-01-01
  test:
    # the same suites on every platform g3rm0n supports
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install shells under test (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish ksh mksh tcsh busybox
      - name: Install bash 5, jq and shells under test (macOS; zsh, dash, ksh, tcsh ship with it)
        if: runner.os == 'macOS'
        run: |
          brew install bash jq fish mksh
          bash --version | head -n1
          /bin/bash --version | head -n1
      - name: Syntax
        run: |
          bash -n g3rm0n install.sh lib/*.sh lib/platform/*.sh completions/g3rm0n.bash tests/*.sh tests/lib/*.sh tests/mock/curl tests/mock/darwin/[a-z]* tests/mock/tput-pipe/tput scripts/*.sh .githooks/* .claude/hooks/*.sh
          zsh -n completions/_g3rm0n tests/zsh-complete.zsh
          fish --no-execute completions/g3rm0n.fish
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck -x g3rm0n install.sh lib/*.sh lib/platform/*.sh completions/g3rm0n.bash tests/*.sh tests/lib/*.sh tests/mock/curl scripts/*.sh .githooks/* .claude/hooks/*.sh
      - name: Temperature sensors on this runner (informational)
        if: runner.os == 'macOS'
        run: |
          bash -c 'source lib/platform/darwin.sh; osascript -l JavaScript <<<"$DW_SENSORS_JS"; echo "osascript exit=$?"'
          # each step of the IOKit path: client, services, temperature events
          bash -c 'source lib/platform/darwin.sh
            js=${DW_SENSORS_JS/'var client = '/'var dbg = []; var client = '}
            js=${js/'if (!client || client.isNil()) return "";'/'dbg.push("client " + (client && !client.isNil())); if (!client || client.isNil()) return dbg.join(" ");'}
            js=${js/'if (!list || list.isNil()) return "";'/'dbg.push("services " + ((list && !list.isNil()) ? list.count : "nil")); if (!list || list.isNil()) return dbg.join(" ");'}
            js=${js/'return out.join("\n");'/'return dbg.join(" ") + " readings " + out.length;'}
            osascript -l JavaScript <<<"$js"; echo "debug exit=$?"'
          ./g3rm0n sensors
      - name: Smoke tests
        run: tests/smoke.sh
      - name: Platform tests (contract, macOS fixtures, native backend)
        run: tests/platform.sh
      - name: AI refresh tests (intervals, rate limits, cache)
        run: tests/ai.sh
      - name: Cross-shell tests (bash, zsh, fish, dash, ksh, mksh, tcsh, busybox)
        run: tests/shells.sh
      - name: Interaction tests (folding, keys, mouse in a pseudo-terminal)
        run: tests/ui.sh
      - name: Install tests (run-time files only, release tarball, bash 3.2)
        run: tests/install.sh
      - name: Docs drift check
        run: tests/docs.sh
      - name: Installer (from checkout, clean HOME)
        run: |
          export HOME=$(mktemp -d)
          ./install.sh
          "$HOME/.local/bin/g3rm0n" version
          ./install.sh --uninstall
          test ! -e "$HOME/.local/bin/g3rm0n"
